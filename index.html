<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Maintenance MRF Tracker</title>
<style>
  :root{
    --bg:#15181C; --panel:#1D2126; --panel2:#22262C; --border:#2C3138; --border-strong:#3A404A;
    --text:#E9EBEE; --text-dim:#9AA1AB; --text-faint:#5C636D;
    --amber:#F2A63C; --amber-dim:#3A2F1A;
    --red:#E5484D; --red-dim:#3A1F20;
    --blue:#4DA3E0; --blue-dim:#1B2A38;
    --green:#3DBE72; --green-dim:#173226;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:40px;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .wrap{max-width:640px; margin:0 auto; padding:0 16px;}

  /* Andon header */
  .andon{background:linear-gradient(180deg,#1A1D22,#141619); border-bottom:2px solid var(--amber); padding:14px 16px 12px;}
  .andon-top{display:flex; justify-content:space-between; align-items:baseline;}
  .brand{font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--amber);}
  .brand-sub{font-size:10px; color:var(--text-faint); letter-spacing:1px; text-transform:uppercase;}
  .andon-stats{display:flex; gap:8px; margin-top:12px;}
  .andon-stat{flex:1; background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:8px 10px;}
  .andon-stat .n{font-size:20px; font-weight:700; font-family:ui-monospace,monospace;}
  .andon-stat .l{font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); margin-top:2px;}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px;}
  .dot.blink{animation:blink 1.1s infinite;}
  @keyframes blink{0%,100%{opacity:1} 50%{opacity:.25}}

  /* Tabs */
  .tabs{display:flex; gap:4px; padding:10px 16px 0; background:var(--bg); position:sticky; top:0; z-index:5;}
  .tab{flex:1; text-align:center; padding:10px 4px; font-size:12px; font-weight:600; letter-spacing:.3px;
    text-transform:uppercase; border-radius:8px 8px 0 0; color:var(--text-dim); cursor:pointer; border:1px solid transparent; border-bottom:none;}
  .tab.active{background:var(--panel); color:var(--amber); border-color:var(--border);}

  .role-switch{display:flex; gap:6px; margin-top:12px;}
  .role-pill{flex:1; text-align:center; padding:8px 4px; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:.5px; border-radius:6px; border:1px solid var(--border-strong); color:var(--text-dim); cursor:pointer;}
  .role-pill.active{background:var(--amber); color:#1A1408; border-color:var(--amber);}
  .role-pill.active.mgr{background:var(--blue); color:#0A1620; border-color:var(--blue);}
  .role-note{font-size:10px; color:var(--text-faint); margin-top:6px; text-align:center;}
  .audit-item{font-size:11px; color:var(--text-faint); margin-top:4px; padding-top:4px; border-top:1px dashed var(--border); font-family:ui-monospace,monospace;}
  input[type=month]{width:100%; background:var(--panel2); border:1px solid var(--border-strong); color:var(--text);
    border-radius:6px; padding:10px; font-size:14px; font-family:inherit; margin-bottom:4px;}
  .rank-meta{font-size:11px; color:var(--text-faint); margin:-4px 0 10px 86px; font-family:ui-monospace,monospace;}
  .tag{display:inline-block; font-size:9px; padding:2px 6px; border-radius:4px; text-transform:uppercase; letter-spacing:.4px; font-weight:700; margin-left:6px; vertical-align:middle;}
  .tag-planned{background:var(--blue-dim); color:var(--blue);}
  .tag-team-ano{background:var(--panel2); border:1px solid #8B5CF6; color:#B79CFF;}
  .tag-team-gen{background:var(--panel2); border:1px solid var(--border-strong); color:var(--text-dim);}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:0 8px 8px 8px; padding:16px; margin:0 16px;}
  .section{margin-top:18px;}
  .section:first-child{margin-top:0;}
  h2{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-faint); margin-bottom:10px; font-weight:700;}

  label{display:block; font-size:12px; color:var(--text-dim); margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  select, input[type=text], textarea{
    width:100%; background:var(--panel2); border:1px solid var(--border-strong); color:var(--text);
    border-radius:6px; padding:10px; font-size:14px; font-family:inherit;
  }
  textarea{min-height:60px; resize:vertical;}
  select:focus, input:focus, textarea:focus{outline:2px solid var(--amber); outline-offset:0;}

  button{
    font-family:inherit; font-size:13px; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
    border-radius:6px; padding:11px 16px; border:none; cursor:pointer; width:100%; margin-top:14px;
  }
  .btn-primary{background:var(--amber); color:#1A1408;}
  .btn-blue{background:var(--blue); color:#0A1620;}
  .btn-green{background:var(--green); color:#08210F;}
  .btn-ghost{background:transparent; border:1px solid var(--border-strong); color:var(--text-dim); margin-top:8px;}
  button:active{transform:scale(0.98);}

  /* Cards */
  .card{background:var(--panel2); border:1px solid var(--border); border-left-width:3px; border-radius:6px; padding:12px; margin-bottom:10px;}
  .card.st-open{border-left-color:var(--red);}
  .card.st-in_progress{border-left-color:var(--amber);}
  .card.st-pending_confirm{border-left-color:var(--blue);}
  .card.st-closed{border-left-color:var(--green);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-machine{font-weight:700; font-size:14px;}
  .badge{font-size:9px; text-transform:uppercase; letter-spacing:.6px; font-weight:700; padding:3px 7px; border-radius:4px; white-space:nowrap;}
  .badge.st-open{background:var(--red-dim); color:var(--red);}
  .badge.st-in_progress{background:var(--amber-dim); color:var(--amber);}
  .badge.st-pending_confirm{background:var(--blue-dim); color:var(--blue);}
  .badge.st-closed{background:var(--green-dim); color:var(--green);}
  .card-desc{font-size:12.5px; color:var(--text-dim); margin-top:6px; line-height:1.4;}
  .card-meta{font-size:11px; color:var(--text-faint); margin-top:8px; font-family:ui-monospace,monospace;}
  .card-elapsed{font-size:11px; margin-top:6px; font-family:ui-monospace,monospace; font-weight:700;}

  .empty{text-align:center; color:var(--text-faint); font-size:13px; padding:30px 10px;}

  /* KPI dashboard */
  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .kpi-card{background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:14px;}
  .kpi-val{font-size:24px; font-weight:700; font-family:ui-monospace,monospace;}
  .kpi-label{font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-faint); margin-top:4px;}
  .kpi-sub{font-size:10px; color:var(--text-faint); margin-top:2px;}

  .bar-row{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .bar-label{width:78px; font-size:11px; color:var(--text-dim); flex-shrink:0; font-family:ui-monospace,monospace;}
  .bar-track{flex:1; background:var(--panel2); border-radius:4px; height:16px; overflow:hidden; border:1px solid var(--border);}
  .bar-fill{height:100%; background:var(--amber);}
  .bar-val{width:44px; text-align:right; font-size:11px; font-family:ui-monospace,monospace; color:var(--text-dim); flex-shrink:0;}

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal{background:var(--panel); border:1px solid var(--border-strong); border-radius:14px 14px 0 0; width:100%; max-width:640px; padding:18px; max-height:85vh; overflow-y:auto;}
  .modal h3{font-size:15px; margin-bottom:14px;}
  .err{color:var(--red); font-size:12px; margin-top:6px; display:none;}
  .field-row{display:flex; gap:8px;}
  .field-row > div{flex:1;}
  .top-actions{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .small-link{font-size:11px; color:var(--text-faint); text-decoration:underline; cursor:pointer; background:none; border:none; width:auto; text-transform:none; font-weight:400; padding:0; margin:0;}
</style>
</head>
<body>

<div class="andon">
  <div class="wrap">
    <div class="andon-top">
      <div><div class="brand">MRF Tracker</div><div class="brand-sub">Breakdown &amp; repair log</div></div>
    </div>
    <!-- Edit the two lines above to your factory / company name -->
    <div class="andon-stats" id="andonStats"></div>
    <div class="role-switch" id="roleSwitch"></div>
    <div class="role-note" id="roleNote"></div>
  </div>
</div>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="content" class="panel"></div>
</div>

<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const MACHINES = ["CNC-01","CNC-02","Press-03","Conveyor-A","Molding-02","Welder-07"];
const FAULT_TYPES = ["Electrical","Mechanical","Hydraulic/Pneumatic","Sensor/PLC","Software","Other"];
const DEPARTMENTS = ["OHC","Logistics","Anodizing","Stamping","QA","HR"];
const DEPT_TEAM = {"OHC":"General FM","Logistics":"General FM","Stamping":"General FM","QA":"General FM","HR":"General FM","Anodizing":"Anodizing FM"};
let state = { tab:'production', records:[], currentUser:'', role:'production', modal:null, teamFilter:'all', _lastOpenCount:null };

function uid(){ return 'mrf_' + Date.now() + '_' + Math.floor(Math.random()*1000); }
function fmtTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function hoursBetween(a,b){ return (new Date(b)-new Date(a))/3600000; }
function fmtHrs(h){ if(h==null||isNaN(h)) return '—'; return h.toFixed(1)+'h'; }
function elapsedStr(iso){
  const ms = Date.now()-new Date(iso).getTime();
  const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
  return h+'h '+m+'m';
}

const firebaseConfig = {
  apiKey: "AIzaSyByvHlCWfIaSbUOQsUe82cDZMJURXESCD8",
  authDomain: "mrf-tracker-1ffef.firebaseapp.com",
  projectId: "mrf-tracker-1ffef",
  storageBucket: "mrf-tracker-1ffef.firebasestorage.app",
  messagingSenderId: "158486091780",
  appId: "1:158486091780:web:9175c3a1e3fc48182fbd51"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const recordsDoc = db.collection('mrf').doc('records');

function initRealtime(){
  recordsDoc.onSnapshot((snap)=>{
    if(snap.exists && snap.data().list){
      state.records = snap.data().list;
    } else {
      state.records = seedData();
      recordsDoc.set({ list: state.records }).catch(e=>console.error(e));
    }
    render();
  }, err=>{
    console.error('Realtime sync error', err);
    document.getElementById('content').innerHTML = `<div class="empty">Could not connect to the live database. Check your internet connection and reload the page.</div>`;
  });
}
async function saveRecords(){
  try{ await recordsDoc.set({ list: state.records }); }
  catch(e){ console.error('save failed', e); alert('Could not save — check your internet connection and try again.'); }
}
function seedData(){
  const now = Date.now();
  const mk = (offsetH, machine, cat, desc, downtimeH, cause, action, type, dept) => {
    const breakdown = new Date(now - offsetH*3600000).toISOString();
    const respond = new Date(new Date(breakdown).getTime()+8*60000).toISOString();
    const end = new Date(new Date(breakdown).getTime()+downtimeH*3600000).toISOString();
    return {id:uid(), machine, faultCategory:cat, description:desc, reportedBy:'Ali (Production)',
      breakdownTime:breakdown, status:'closed', technician:'Rizal (FM)', responseTime:respond,
      rootCause:cause, actionTaken:action, partsUsed:'', repairEndTime:end,
      confirmedBy:'Ali (Production)', confirmTime:end, auditLog:[], breakdownType:type||'unplanned',
      department:dept||'Stamping', fmTeam:DEPT_TEAM[dept||'Stamping']};
  };
  return [
    mk(720,'CNC-01','Electrical','Spindle motor tripped on overload','2.1','Worn bearing causing overload','Replaced spindle bearing','unplanned','Stamping'),
    mk(600,'Press-03','Hydraulic/Pneumatic','Hydraulic pressure not building','1.4','Hose leak at cylinder','Replaced hydraulic hose, refilled oil','unplanned','Stamping'),
    mk(480,'CNC-01','Sensor/PLC','Position sensor fault E-42','0.6','Loose sensor cable','Reseated and secured cable','unplanned','Stamping'),
    mk(360,'Conveyor-A','Mechanical','Belt slipping, jam at station 2','1.8','Belt tension loss','Retensioned belt, cleaned rollers','unplanned','Logistics'),
    mk(240,'Molding-02','Electrical','Heater band not reaching setpoint','3.2','Heater band burnt out','Replaced heater band and thermocouple','unplanned','Anodizing'),
    mk(96,'Press-03','Mechanical','Unusual noise from ram','0.9','Loose mounting bolts','Torqued mounting bolts to spec','unplanned','Stamping'),
    mk(168,'Welder-07','Mechanical','Found during scheduled PM — worn electrode tip','1.2','Normal wear, within PM scope','Replaced electrode tip during PM','planned','Anodizing'),
  ];
}

function statusLabel(s){ return {open:'Open',in_progress:'In progress',pending_confirm:'Pending sign-off',closed:'Closed'}[s]; }

const ROLES = [
  {id:'production', label:'Production', password:'prod123', note:'Can report breakdowns and confirm repairs are done. Can\'t edit FM timings.'},
  {id:'maintenance', label:'Maintenance', password:'maint123', note:'Can accept and complete jobs. Timings lock once logged.'},
  {id:'manager', label:'Manager', password:'mgr123', note:'Full visibility. Only role that can edit locked timings — every edit needs a reason and is logged.'},
];
const TABS = [
  {id:'production', label:'Report', roles:['production','manager']},
  {id:'maintenance', label:'Repair queue', roles:['maintenance','manager']},
  {id:'dashboard', label:'Live status', roles:['production','maintenance','manager']},
  {id:'monthly', label:'Monthly report', roles:['production','maintenance','manager']},
  {id:'manager', label:'Manage records', roles:['manager']},
];

function requestRoleSwitch(roleId){
  if(roleId === state.role) return;
  const roleObj = ROLES.find(r=>r.id===roleId);
  showModal(`
    <h3>Switch to ${roleObj.label}</h3>
    <div class="role-note" style="text-align:left; margin-bottom:6px;">Enter the ${roleObj.label} password to switch views.</div>
    <label>Password</label>
    <input type="password" id="r_pass" placeholder="Password" onkeydown="if(event.key==='Enter') tryRoleLogin('${roleId}')">
    <div class="err" id="e_rpass">Incorrect password — try again</div>
    <button class="btn-blue" onclick="tryRoleLogin('${roleId}')">Unlock</button>
    <button class="btn-ghost" onclick="closeModal()">Cancel</button>
  `);
  setTimeout(()=>{ const el=document.getElementById('r_pass'); if(el) el.focus(); }, 50);
}
function tryRoleLogin(roleId){
  const roleObj = ROLES.find(r=>r.id===roleId);
  const pass = document.getElementById('r_pass').value;
  if(pass === roleObj.password){
    closeModal();
    setRole(roleId);
  } else {
    document.getElementById('e_rpass').style.display = 'block';
  }
}

function setRole(role){
  state.role = role;
  const allowed = TABS.filter(t=>t.roles.includes(role)).map(t=>t.id);
  if(!allowed.includes(state.tab)) state.tab = allowed[0];
  render();
}

function renderRoleSwitch(){
  document.getElementById('roleSwitch').innerHTML = ROLES.map(r=>
    `<div class="role-pill ${state.role===r.id?'active':''} ${state.role===r.id&&r.id==='manager'?'mgr':''}" onclick="requestRoleSwitch('${r.id}')">${r.label}</div>`
  ).join('');
  document.getElementById('roleNote').textContent = (ROLES.find(r=>r.id===state.role)||{}).note || '';
}

function render(){
  checkForNewOpenAlerts();
  renderAndon();
  renderRoleSwitch();
  renderTabs();
  renderContent();
}

function checkForNewOpenAlerts(){
  const openCount = state.records.filter(r=>r.status==='open').length;
  if(state._lastOpenCount!==null && openCount > state._lastOpenCount && (state.role==='maintenance' || state.role==='manager')){
    triggerNewJobAlert();
  }
  state._lastOpenCount = openCount;
}
function triggerNewJobAlert(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); setTimeout(()=>{ o.stop(); ctx.close(); }, 250);
  }catch(e){}
  if(window.Notification && Notification.permission==='granted'){
    try{ new Notification('New breakdown reported', {body:'Check the repair queue.'}); }catch(e){}
  }
}
function enableNotifications(){
  if(!window.Notification){ alert('Notifications are not supported in this browser.'); return; }
  Notification.requestPermission().then(p=>{
    if(p==='granted') alert('Notifications enabled — you\'ll get an alert sound and banner when a new breakdown is reported while this app is open.');
    else alert('Notifications were not enabled.');
  });
}

function renderAndon(){
  const open = state.records.filter(r=>r.status==='open').length;
  const inProg = state.records.filter(r=>r.status==='in_progress').length;
  const pending = state.records.filter(r=>r.status==='pending_confirm').length;
  const closedThisMonth = state.records.filter(r=>r.status==='closed' && isThisMonth(r.breakdownTime)).length;
  const el = document.getElementById('andonStats');
  el.innerHTML = `
    <div class="andon-stat"><div class="n" style="color:var(--red)"><span class="dot blink" style="background:var(--red)"></span>${open}</div><div class="l">Open</div></div>
    <div class="andon-stat"><div class="n" style="color:var(--amber)">${inProg}</div><div class="l">Repairing</div></div>
    <div class="andon-stat"><div class="n" style="color:var(--blue)">${pending}</div><div class="l">Awaiting sign-off</div></div>
    <div class="andon-stat"><div class="n" style="color:var(--green)">${closedThisMonth}</div><div class="l">Closed / mo</div></div>
  `;
}
function isThisMonth(iso){ const d=new Date(iso), n=new Date(); return d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear(); }

function renderTabs(){
  const visible = TABS.filter(t=>t.roles.includes(state.role));
  document.getElementById('tabs').innerHTML = visible.map(t=>
    `<div class="tab ${state.tab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.label}</div>`).join('');
}
function setTab(t){ state.tab=t; render(); }

function renderContent(){
  const c = document.getElementById('content');
  if(state.tab==='production') c.innerHTML = productionView();
  else if(state.tab==='maintenance') c.innerHTML = maintenanceView();
  else if(state.tab==='manager') c.innerHTML = managerView();
  else if(state.tab==='monthly') c.innerHTML = monthlyReportView();
  else c.innerHTML = dashboardView();
}

/* ---------- PRODUCTION VIEW ---------- */
function productionView(){
  const mine = state.records.slice().sort((a,b)=>new Date(b.breakdownTime)-new Date(a.breakdownTime));
  return `
    <div class="section">
      <button class="btn-primary" onclick="openReportModal()">+ Report breakdown</button>
    </div>
    <div class="section">
      <h2>Awaiting your sign-off (${mine.filter(r=>r.status==='pending_confirm').length})</h2>
      ${listCards(mine.filter(r=>r.status==='pending_confirm'), 'production')}
    </div>
    <div class="section">
      <h2>All reports</h2>
      ${listCards(mine, 'production')}
    </div>
  `;
}

/* ---------- MAINTENANCE VIEW ---------- */
function maintenanceView(){
  const teamFilter = state.teamFilter || 'all';
  const filterFn = r => teamFilter==='all' || r.fmTeam===teamFilter;
  const open = state.records.filter(r=>r.status==='open').filter(filterFn).sort((a,b)=>new Date(a.breakdownTime)-new Date(b.breakdownTime));
  const active = state.records.filter(r=>r.status==='in_progress').filter(filterFn).sort((a,b)=>new Date(a.breakdownTime)-new Date(b.breakdownTime));
  const teams = ['all', ...new Set(Object.values(DEPT_TEAM))];
  return `
    <div class="section">
      <div class="role-switch" style="margin-top:0;">
        ${teams.map(t=>`<div class="role-pill ${teamFilter===t?'active':''}" onclick="setTeamFilter('${t}')">${t==='all'?'All teams':t}</div>`).join('')}
      </div>
      <button class="btn-ghost" onclick="enableNotifications()">🔔 Enable alert sound for new jobs</button>
    </div>
    <div class="section">
      <h2>Open — needs response (${open.length})</h2>
      ${listCards(open, 'maintenance')}
    </div>
    <div class="section">
      <h2>In progress (${active.length})</h2>
      ${listCards(active, 'maintenance')}
    </div>
  `;
}
function setTeamFilter(t){ state.teamFilter = t; render(); }

function managerView(){
  const all = state.records.slice().sort((a,b)=>new Date(b.breakdownTime)-new Date(a.breakdownTime));
  return `
    <div class="section">
      <h2>All records — timings locked to production/maintenance once logged</h2>
      ${listCards(all, 'manager')}
    </div>
  `;
}

function listCards(records, ctx){
  if(records.length===0) return `<div class="empty">Nothing here right now.</div>`;
  return records.map(r=>{
    let actionBtn = '';
    if(ctx==='maintenance' && r.status==='open'){
      actionBtn = `<button class="btn-blue" onclick="openAcceptModal('${r.id}')">Accept &amp; start repair</button>`;
    } else if(ctx==='maintenance' && r.status==='in_progress'){
      actionBtn = `<button class="btn-green" onclick="openCompleteModal('${r.id}')">Complete repair</button>`;
    } else if(ctx==='production' && r.status==='pending_confirm'){
      actionBtn = `<button class="btn-primary" onclick="confirmClose('${r.id}')">Confirm &amp; close</button>`;
    } else if(ctx==='manager'){
      actionBtn = `<button class="btn-ghost" onclick="openEditModal('${r.id}')">Edit timings (reason required)</button>`;
    }
    const auditHtml = (r.auditLog && r.auditLog.length) ? r.auditLog.map(a=>
      `<div class="audit-item">✎ Edited by ${a.who} on ${fmtTime(a.when)} — "${escapeHtml(a.reason)}" (${escapeHtml(a.changes)})</div>`
    ).join('') : '';
    let elapsed = '';
    if(r.status==='open') elapsed = `<div class="card-elapsed" style="color:var(--red)">Down ${elapsedStr(r.breakdownTime)}</div>`;
    else if(r.status==='in_progress') elapsed = `<div class="card-elapsed" style="color:var(--amber)">Down ${elapsedStr(r.breakdownTime)}</div>`;
    return `
      <div class="card st-${r.status}">
        <div class="card-top">
          <div class="card-machine">${r.machine} <span style="color:var(--text-faint); font-weight:400; font-size:11px;">· ${r.faultCategory}${r.department?' · '+r.department:''}</span>${r.breakdownType==='planned'?'<span class="tag tag-planned">Planned / PM</span>':''}${r.fmTeam==='Anodizing FM'?'<span class="tag tag-team-ano">Anodizing FM</span>':(r.fmTeam?'<span class="tag tag-team-gen">General FM</span>':'')}</div>
          <span class="badge st-${r.status}">${statusLabel(r.status)}</span>
        </div>
        <div class="card-desc">${escapeHtml(r.description)}</div>
        <div class="card-meta">Reported ${fmtTime(r.breakdownTime)} by ${r.reportedBy}${r.technician?' · Tech: '+r.technician:''}</div>
        ${r.status==='closed' ? `<div class="card-meta">Downtime: ${fmtHrs(hoursBetween(r.breakdownTime,r.repairEndTime))} · Cause: ${escapeHtml(r.rootCause||'—')}</div>` : ''}
        ${elapsed}
        ${auditHtml}
        ${actionBtn}
      </div>
    `;
  }).join('');
}

function isoToLocalInput(iso){
  if(!iso) return '';
  const d = new Date(iso), p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function localInputToIso(val){ return val ? new Date(val).toISOString() : null; }

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

/* ---------- MODALS ---------- */

    <div class="err" id="e_name">Enter your name</div>

    <datalist id="machineOptions">${MACHINES.map(m=>`<option value="${m}">`).join('')}</datalist>
    <div class="err" id="e_machine">Enter or select a machine</div>
    <label>Fault type</label>
    <select id="f_cat">${FAULT_TYPES.map(m=>`<option>${m}</option>`).join('')}</select>
    <label>Type</label>
    <select id="f_type">
      <option value="unplanned">Unplanned breakdown</option>
      <option value="planned">Planned / found during PM</option>
    </select>
    <label>Describe the problem</label>
    <textarea id="f_desc" placeholder="What's happening on the machine?"></textarea>
    <div class="err" id="e_desc">Enter a description</div>
    <button class="btn-primary" onclick="submitReport()">Submit report — starts downtime clock</button>
    <button class="btn-ghost" onclick="closeModal()">Cancel</button>
  `);
}
function submitReport(){
  const name = document.getElementById('f_name').value.trim();
  const machine = document.getElementById('f_machine').value.trim();
  const desc = document.getElementById('f_desc').value.trim();
  let ok = true;
  document.getElementById('e_name').style.display = name ? 'none' : 'block'; if(!name) ok=false;
  document.getElementById('e_machine').style.display = machine ? 'none' : 'block'; if(!machine) ok=false;
  document.getElementById('e_desc').style.display = desc ? 'none' : 'block'; if(!desc) ok=false;
  if(!ok) return;
  state.currentUser = name;
  const rec = {
    id:uid(), machine:machine, faultCategory:document.getElementById('f_cat').value,
    breakdownType:document.getElementById('f_type').value,
    department:document.getElementById('f_dept').value,
    fmTeam:DEPT_TEAM[document.getElementById('f_dept').value],
    description:desc, reportedBy:name, breakdownTime:new Date().toISOString(), status:'open',
    technician:'', responseTime:null, rootCause:'', actionTaken:'', partsUsed:'', repairEndTime:null,
    confirmedBy:'', confirmTime:null, auditLog:[]
  };
  state.records.unshift(rec);
  saveRecords();
  closeModal();
  state.tab='production';
  render();
}

    <input type="text" id="f_tech" placeholder="Your name">
    <div class="err" id="e_tech">Enter technician name</div>
    <button class="btn-blue" onclick="acceptRepair('${id}')">Start repair — logs response time</button>

}

function openCompleteModal(id){
  showModal(`
    <h3>Complete repair</h3>
    <label>Root cause</label>
    <input type="text" id="f_cause" placeholder="What caused the breakdown?">
    <div class="err" id="e_cause">Enter root cause</div>
    <label>Action taken</label>

    <div class="err" id="e_action">Enter action taken</div>

function completeRepair(id){

  document.getElementById('e_cause').style.display = cause?'none':'block'; if(!cause) ok=false;
  document.getElementById('e_action').style.display = action?'none':'block'; if(!action) ok=false;
  if(!ok) return;

  r.status='closed'; r.confirmedBy=state.currentUser||r.reportedBy; r.confirmTime=new Date().toISOString();

function showModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this) closeModal()"><div class="modal">${html}</div></div>`;

function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function openEditModal(id){
  const r = state.records.find(x=>x.id===id);
  showModal(`
    <h3>Edit timings — ${r.machine}</h3>
    <div class="role-note" style="text-align:left; margin-bottom:6px;">Manager override. Every change here is logged with your name and reason — it does not delete the original entry.</div>
    <label>Your name</label>
    <input type="text" id="m_name" placeholder="Manager name" value="${state.currentUser}">
    <div class="err" id="e_mname">Enter your name</div>
    <label>Breakdown time</label>
    <input type="datetime-local" id="m_break" value="${isoToLocalInput(r.breakdownTime)}">
    <label>FM response time</label>
    <input type="datetime-local" id="m_resp" value="${isoToLocalInput(r.responseTime)}">
    <label>Repair end time</label>
    <input type="datetime-local" id="m_end" value="${isoToLocalInput(r.repairEndTime)}">
    <label>Reason for edit (required)</label>
    <textarea id="m_reason" placeholder="e.g. Technician forgot to log start time, confirmed verbally at 14:20"></textarea>
    <div class="err" id="e_mreason">Explain why this is being changed</div>
    <button class="btn-blue" onclick="saveEdit('${id}')">Save correction</button>
    <button class="btn-ghost" onclick="closeModal()">Cancel</button>
  `);
}
function saveEdit(id){
  const name = document.getElementById('m_name').value.trim();
  const reason = document.getElementById('m_reason').value.trim();
  let ok = true;
  document.getElementById('e_mname').style.display = name ? 'none' : 'block'; if(!name) ok=false;
  document.getElementById('e_mreason').style.display = reason ? 'none' : 'block'; if(!reason) ok=false;
  if(!ok) return;
  const r = state.records.find(x=>x.id===id);
  const newBreak = localInputToIso(document.getElementById('m_break').value);
  const newResp = localInputToIso(document.getElementById('m_resp').value);
  const newEnd = localInputToIso(document.getElementById('m_end').value);
  const changes = [];
  if(newBreak !== r.breakdownTime) changes.push(`breakdown ${fmtTime(r.breakdownTime)}→${fmtTime(newBreak)}`);
  if(newResp !== r.responseTime) changes.push(`response ${fmtTime(r.responseTime)}→${fmtTime(newResp)}`);
  if(newEnd !== r.repairEndTime) changes.push(`repair end ${fmtTime(r.repairEndTime)}→${fmtTime(newEnd)}`);
  if(changes.length===0){ closeModal(); return; }
  r.breakdownTime = newBreak; r.responseTime = newResp; r.repairEndTime = newEnd;
  r.auditLog = r.auditLog || [];
  r.auditLog.push({who:name, when:new Date().toISOString(), reason, changes:changes.join('; ')});
  state.currentUser = name;
  saveRecords(); closeModal(); render();
}

/* ---------- MONTHLY REPORT ---------- */
function ymOf(iso){ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long', year:'numeric'}); }
function setReportMonth(v){ state.reportMonth = v; renderContent(); }

function computeMonthlyStats(ym){
  const [y,m] = ym.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const periodHours = daysInMonth*24;

  const monthRecords = state.records.filter(r=>ymOf(r.breakdownTime)===ym);
  const closedMonth = monthRecords.filter(r=>r.status==='closed');
  const stillOpen = monthRecords.filter(r=>r.status!=='closed');
  const unplanned = closedMonth.filter(r=>r.breakdownType!=='planned');
  const planned = closedMonth.filter(r=>r.breakdownType==='planned');

  const totalDowntime = unplanned.reduce((s,r)=>s+hoursBetween(r.breakdownTime,r.repairEndTime),0);
  const nEvents = unplanned.length;
  const mttr = nEvents? totalDowntime/nEvents : null;
  const uptime = Math.max(periodHours-totalDowntime,0);
  const mtbf = nEvents? uptime/nEvents : null;
  const availability = periodHours? uptime/periodHours*100 : null;
  const plannedDowntime = planned.reduce((s,r)=>s+hoursBetween(r.breakdownTime,r.repairEndTime),0);

  const machineStats = {};
  unplanned.forEach(r=>{
    const h = hoursBetween(r.breakdownTime, r.repairEndTime);
    if(!machineStats[r.machine]) machineStats[r.machine] = {count:0, downtime:0};
    machineStats[r.machine].count++;
    machineStats[r.machine].downtime += h;
  });
  const machineRows = Object.entries(machineStats).map(([mach,s])=>({
    machine:mach, count:s.count, downtime:s.downtime, mttr:s.downtime/s.count
  })).sort((a,b)=> b.count-a.count || b.downtime-a.downtime);

  return {ym, periodHours, monthRecords, closedMonth, stillOpen, unplanned, planned,
    totalDowntime, nEvents, mttr, uptime, mtbf, availability, plannedDowntime, machineRows};
}

function monthlyReportView(){
  if(!state.reportMonth){
    const n=new Date(); state.reportMonth = n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');
  }
  const ym = state.reportMonth;
  const s = computeMonthlyStats(ym);
  const maxCount = Math.max(1, ...s.machineRows.map(r=>r.count));

  return `
    <div class="section">
      <h2>Select month</h2>
      <input type="month" value="${ym}" onchange="setReportMonth(this.value)">
      <button class="btn-primary" onclick="exportMonthlyReport()">⬇ Download Excel report</button>
    </div>
    <div class="section">
      <h2>${monthLabel(ym)} — unplanned failures</h2>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-val" style="color:var(--amber)">${fmtHrs(s.mttr)}</div><div class="kpi-label">MTTR</div><div class="kpi-sub">avg repair time / event</div></div>
        <div class="kpi-card"><div class="kpi-val" style="color:var(--blue)">${fmtHrs(s.mtbf)}</div><div class="kpi-label">MTBF</div><div class="kpi-sub">avg uptime between failures</div></div>
        <div class="kpi-card"><div class="kpi-val" style="color:var(--green)">${s.availability!=null?s.availability.toFixed(1)+'%':'—'}</div><div class="kpi-label">Availability</div><div class="kpi-sub">uptime / total time</div></div>
        <div class="kpi-card"><div class="kpi-val">${s.nEvents}</div><div class="kpi-label">Breakdowns</div><div class="kpi-sub">${s.totalDowntime.toFixed(1)}h total downtime</div></div>
      </div>
      ${s.stillOpen.length ? `<div class="role-note" style="text-align:left; margin-top:10px; color:var(--amber)">${s.stillOpen.length} job(s) reported this month are still open or in repair — they'll count once closed.</div>` : ''}
    </div>
    <div class="section">
      <h2>Planned / PM-related this month</h2>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-val">${s.planned.length}</div><div class="kpi-label">PM-related jobs</div><div class="kpi-sub">${s.plannedDowntime.toFixed(1)}h total — excluded from KPIs above</div></div>
      </div>
    </div>
    <div class="section">
      <h2>By machine — worst offenders first</h2>
      ${s.machineRows.length===0 ? `<div class="empty">No unplanned breakdowns closed in this month.</div>` :
        s.machineRows.map(r=>`
          <div class="bar-row">
            <div class="bar-label">${r.machine}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(r.count/maxCount*100).toFixed(0)}%"></div></div>
            <div class="bar-val">${r.count}x</div>
          </div>
          <div class="rank-meta">${r.downtime.toFixed(1)}h downtime · MTTR ${r.mttr.toFixed(1)}h</div>
        `).join('')
      }
    </div>
    <div class="section">
      <h2>All records — ${monthLabel(ym)}</h2>
      ${listCards(s.monthRecords.slice().sort((a,b)=>new Date(b.breakdownTime)-new Date(a.breakdownTime)), 'view')}
    </div>
  `;
}

function exportMonthlyReport(){
  const ym = state.reportMonth;
  const s = computeMonthlyStats(ym);
  const full = iso => iso ? new Date(iso).toLocaleString('en-GB') : '';

  const summarySheet = XLSX.utils.json_to_sheet([
    {Metric:'Report month', Value: monthLabel(ym)},
    {Metric:'MTTR (hours)', Value: s.mttr!=null? +s.mttr.toFixed(2) : ''},
    {Metric:'MTBF (hours)', Value: s.mtbf!=null? +s.mtbf.toFixed(2) : ''},
    {Metric:'Availability (%)', Value: s.availability!=null? +s.availability.toFixed(1) : ''},
    {Metric:'Unplanned breakdowns (closed)', Value: s.nEvents},
    {Metric:'Total unplanned downtime (hours)', Value: +s.totalDowntime.toFixed(2)},
    {Metric:'Planned/PM jobs (closed)', Value: s.planned.length},
    {Metric:'Total planned/PM downtime (hours)', Value: +s.plannedDowntime.toFixed(2)},
    {Metric:'Still open / in-progress (not yet counted)', Value: s.stillOpen.length},
  ]);

  const machineSheet = XLSX.utils.json_to_sheet(s.machineRows.map(r=>({
    Machine:r.machine, Breakdowns:r.count, 'Total downtime (h)': +r.downtime.toFixed(2), 'MTTR (h)': +r.mttr.toFixed(2)
  })));

  const recordsSheet = XLSX.utils.json_to_sheet(s.monthRecords.map(r=>({
    Machine:r.machine, Department:r.department||'', 'FM Team':r.fmTeam||'', Type: r.breakdownType==='planned'?'Planned/PM':'Unplanned', 'Fault category':r.faultCategory,
    Description:r.description, 'Reported by':r.reportedBy, 'Breakdown time':full(r.breakdownTime),
    Technician:r.technician||'', 'Response time':full(r.responseTime), 'Root cause':r.rootCause||'',
    'Action taken':r.actionTaken||'', 'Parts used':r.partsUsed||'', 'Repair end time':full(r.repairEndTime),
    'Downtime (h)': r.repairEndTime? +hoursBetween(r.breakdownTime,r.repairEndTime).toFixed(2) : '',
    Status: statusLabel(r.status), 'Confirmed by': r.confirmedBy||''
  })));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, summarySheet, 'Summary');
  XLSX.utils.book_append_sheet(wb, machineSheet, 'By Machine');
  XLSX.utils.book_append_sheet(wb, recordsSheet, 'All Records');
  XLSX.writeFile(wb, `MRF-Report-${ym}.xlsx`);
}

/* ---------- KPI DASHBOARD ---------- */
function dashboardView(){
  const closed = state.records.filter(r=>r.status==='closed');
  const periodStart = new Date(); periodStart.setDate(1); periodStart.setHours(0,0,0,0);
  const periodEnd = new Date();
  const periodHours = Math.max((periodEnd-periodStart)/3600000, 1);

  const closedThisMonth = closed.filter(r=>isThisMonth(r.breakdownTime));
  const unplanned = closedThisMonth.filter(r=>r.breakdownType!=='planned');
  const planned = closedThisMonth.filter(r=>r.breakdownType==='planned');
  const totalDowntime = unplanned.reduce((s,r)=>s+hoursBetween(r.breakdownTime,r.repairEndTime),0);
  const plannedDowntime = planned.reduce((s,r)=>s+hoursBetween(r.breakdownTime,r.repairEndTime),0);
  const n = unplanned.length;
  const mttr = n? totalDowntime/n : null;
  const uptime = Math.max(periodHours - totalDowntime, 0);
  const mtbf = n? uptime/n : null;
  const availability = periodHours? (uptime/periodHours*100) : null;

  const byMachine = {};
  unplanned.forEach(r=>{
    byMachine[r.machine] = (byMachine[r.machine]||0) + hoursBetween(r.breakdownTime,r.repairEndTime);
  });
  const maxDt = Math.max(1, ...Object.values(byMachine));

  return `
    <div class="section">
      <h2>This month so far — unplanned failures only</h2>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-val" style="color:var(--amber)">${fmtHrs(mttr)}</div><div class="kpi-label">MTTR</div><div class="kpi-sub">avg repair time / event</div></div>
        <div class="kpi-card"><div class="kpi-val" style="color:var(--blue)">${fmtHrs(mtbf)}</div><div class="kpi-label">MTBF</div><div class="kpi-sub">avg uptime between failures</div></div>
        <div class="kpi-card"><div class="kpi-val" style="color:var(--green)">${availability!=null?availability.toFixed(1)+'%':'—'}</div><div class="kpi-label">Availability</div><div class="kpi-sub">uptime / total time</div></div>
        <div class="kpi-card"><div class="kpi-val">${n}</div><div class="kpi-label">Unplanned breakdowns</div><div class="kpi-sub">${totalDowntime.toFixed(1)}h total downtime</div></div>
      </div>
      <div class="role-note" style="text-align:left; margin-top:10px;">Planned/PM-related MRFs are tracked separately below and excluded from these numbers — they're scheduled work, not failures, so mixing them in would distort your availability and MTBF.</div>
    </div>
    <div class="section">
      <h2>Planned / PM-related MRFs this month</h2>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-val">${planned.length}</div><div class="kpi-label">PM-related jobs</div><div class="kpi-sub">${plannedDowntime.toFixed(1)}h total</div></div>
      </div>
    </div>
    <div class="section">
      <h2>Downtime by machine (this month)</h2>
      ${Object.keys(byMachine).length===0 ? `<div class="empty">No closed breakdowns yet this month.</div>` :
        Object.entries(byMachine).sort((a,b)=>b[1]-a[1]).map(([m,h])=>`
          <div class="bar-row">
            <div class="bar-label">${m}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(h/maxDt*100).toFixed(0)}%"></div></div>
            <div class="bar-val">${h.toFixed(1)}h</div>
          </div>
        `).join('')
      }
    </div>
    <div class="section">
      <h2>All closed records</h2>
      ${listCards(closed.sort((a,b)=>new Date(b.breakdownTime)-new Date(a.breakdownTime)), 'view')}
    </div>
    <div class="section">
      <button class="btn-ghost" onclick="resetDemo()">Reset demo data</button>
    </div>
  `;
}

async function resetDemo(){
  state.records = seedData();
  await saveRecords();
  render();
}

/* ---------- INIT ---------- */
(function init(){
  initRealtime();
  setInterval(()=>{ if(state.tab!=='dashboard') { renderAndon(); if(!document.getElementById('modalRoot').innerHTML) renderContent(); } }, 30000);
})();
</script>
